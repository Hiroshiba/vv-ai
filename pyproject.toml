[project]
name = "vv-ai"
version = "0.1.0"
description = "GitHub Actions とローカル実行を対象にした AI 自動化ツールキット"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
vv-ai = "vv_ai.cli:main"
onetask = "onetask.cli:main"
set-codex-auth-secret = "tools.set_codex_auth_secret:main"
set-claude-settings-secret = "tools.set_claude_settings_secret:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.uv.build-backend]
module-name = ["vv_ai", "onetask", "tools"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
