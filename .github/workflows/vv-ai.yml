name: vv-ai

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: "コマンド"
        required: true
        type: choice
        options: [reply, plan, implement, review, issue]
      target_type:
        description: "対象種別 (issue / pr)"
        required: false
        type: choice
        options: ["", issue, pr]
        default: ""
      target_number:
        description: "対象番号"
        required: false
        type: string
      target_url:
        description: "対象 URL"
        required: false
        type: string
      instruction:
        description: "指示"
        required: false
        type: string
      provider:
        description: "AI プロバイダ (codex / claude)"
        required: false
        type: choice
        options: ["", codex, claude]
        default: ""
      session_mode:
        description: "セッション継続方式 (inherit / compact / new)"
        required: false
        type: choice
        options: ["", inherit, compact, new]
        default: ""
      dry_run:
        description: "ドライラン"
        required: false
        type: boolean
        default: false
      repo:
        description: "Issue 作成先 org/repo (issue コマンド用)"
        required: false
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.issue.number ||
      inputs.target_number ||
      inputs.target_url ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup secrets
        env:
          VV_OPENAI_API_KEY: ${{ secrets.VV_OPENAI_API_KEY }}
          VV_ANTHROPIC_API_KEY: ${{ secrets.VV_ANTHROPIC_API_KEY }}
          VV_AI_AGE_PUBLIC_KEY: ${{ secrets.VV_AI_AGE_PUBLIC_KEY }}
          VV_AI_AGE_SECRET_KEY: ${{ secrets.VV_AI_AGE_SECRET_KEY }}
        run: |
          mkdir -p /home/runner/.vv-secrets
          chmod 700 /home/runner/.vv-secrets
          printf '%s' "$VV_OPENAI_API_KEY"    > /home/runner/.vv-secrets/openai_key
          printf '%s' "$VV_ANTHROPIC_API_KEY" > /home/runner/.vv-secrets/anthropic_key
          printf '%s' "$VV_AI_AGE_PUBLIC_KEY" > /home/runner/.vv-secrets/age_public_key
          printf '%s' "$VV_AI_AGE_SECRET_KEY" > /home/runner/.vv-secrets/age_secret_key
          chmod 400 /home/runner/.vv-secrets/*

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Install age
        run: |
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            | tar xz
          sudo mv age/age age/age-keygen /usr/local/bin/

      - name: Install AI CLIs
        run: |
          npm install -g @openai/codex
          npm install -g @anthropic-ai/claude-code

      - name: Run vv-ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VV_OPENAI_API_KEY_FILE: /home/runner/.vv-secrets/openai_key
          VV_ANTHROPIC_API_KEY_FILE: /home/runner/.vv-secrets/anthropic_key
          VV_AI_AGE_PUBLIC_KEY_FILE: /home/runner/.vv-secrets/age_public_key
          VV_AI_AGE_SECRET_KEY_FILE: /home/runner/.vv-secrets/age_secret_key
          VV_CLAUDE_SETTINGS: ${{ secrets.VV_CLAUDE_SETTINGS }}
        run: |
          uv run vv-ai \
            --event "${{ github.event_name }}" \
            --event-file "$GITHUB_EVENT_PATH"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vv-ai-artifacts-${{ github.run_id }}
          path: .vv-ai/artifacts/
          retention-days: 90
          if-no-files-found: ignore
